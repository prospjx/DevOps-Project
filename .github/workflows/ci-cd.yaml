name: CI-CD

on:
  push:
    branches: master

jobs:
  build:
    runs-on: ubuntu-latest

  # added this
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: tasksdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # added this

    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: format code
        run: black --check .
      - name: lint code
        run: ruff check . --select I
      - name: test with pytest
        env:
          APP_NAME: "Task Awesome"
          APP_VERSION: "3.0.0"
          ENVIRONMENT: "developmentisago!"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest -v app/
      - name: Build Docker image
        run: Docker build -t imain-app -f docker/Dockerfile .


