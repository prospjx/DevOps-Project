name: CI-CD

on:
  push:
    branch:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
  
  permissions:
    content: write
    package: write
  
  services:
    name: postgres
    image: postgres:16-alpine
    env:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=tasksdb
    ports:
      - 5432:5432
    options: 
      health-cmd pg_isready
      health-retries 5
  
  steps:
    - name: Checkout
      run: actions/checkout@v4

    - name: Setup Python Environment
      run: actions/setup-python@v5

    - name: Install Dependencies
      run: pip install -r requirements.txt
    
    - name: Check Code Formatting
      run: black check .
    
    - name: Lint Code
      run: ruff --check . select I

    - name: Login, Build and Push to Docker Hub
      run: |
        docker build -t prospjx/imain-app:latest -f docker/Dockerfile .
        docker login -u prospjx -p ${{ secrets.DOCKER_PATCODE }}
        docker push prospjx/imain-app:latest
    
    - name: Build, Login and Push to GHCR
      run: |
        IMAGE_ID = prospjx/(echo ${{github.repository}}) | tr '[:upper:]' '[:lower:]')/imain-app:latest
        echo ${{ GITHUB_TOKEN }} | docker login ghcr.io --username {{ github.actor }} --password-stdin
        docker build -t $IMAGE_ID -f docker/Dockerfile .
        docker push $IMAGE_ID
    

  