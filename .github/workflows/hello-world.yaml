name: Hello Workflow

on:
  push:
    branches:
      - master

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Message
        run: echo "Hello from GitHub Actions!"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la